[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "real_estate_intelligence"
version = "0.1.0"
description = "Evidence-backed Gujarat Real Estate Intelligence Platform for Analytical Buyers and Investors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["real_estate_intelligence*"]
